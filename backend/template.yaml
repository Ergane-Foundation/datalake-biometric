AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Optional, self-hosted sync backend for datalake-biometric: an HTTP API with a
  token authorizer, a Lambda that stores attendance records, and a DynamoDB
  table with a 90-day TTL. See backend/README.md before deploying.

Parameters:
  SyncTokenParameterName:
    Type: String
    Default: datalake-biometric/sync-token
    Description: >
      SSM Parameter Store name (without the leading slash) of a SecureString
      holding the API token. Create it before deploying; see backend/README.md.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Architectures:
      - arm64

Resources:
  AttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-attendance"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: workerId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: WorkerTimestampIndex
          KeySchema:
            - AttributeName: workerId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-sync"
      CodeUri: ./
      Handler: lambda_sync_handler.handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref AttendanceTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AttendanceTable
      Events:
        Sync:
          Type: HttpApi
          Properties:
            ApiId: !Ref SyncApi
            Path: /sync
            Method: POST

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-authorizer"
      CodeUri: ./
      Handler: authorizer.handler
      Environment:
        Variables:
          TOKEN_PARAMETER: !Sub "/${SyncTokenParameterName}"
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref SyncTokenParameterName

  SyncApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Mobile apps do not need CORS, so no browser origin is allowed.
      Auth:
        DefaultAuthorizer: TokenAuthorizer
        Authorizers:
          TokenAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization
              ReauthorizeEvery: 300
      # Caps request rate so a leaked token cannot run up large costs.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

Outputs:
  ApiUrl:
    Description: Sync endpoint to enter on the example app's Sync screen.
    Value: !Sub "https://${SyncApi}.execute-api.${AWS::Region}.amazonaws.com/sync"
  TableName:
    Description: DynamoDB table holding synced records.
    Value: !Ref AttendanceTable
