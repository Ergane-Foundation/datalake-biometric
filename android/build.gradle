buildscript {
  ext.DatalakeBiometric = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return DatalakeBiometric[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.datalakebiometric"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  aaptOptions {
    noCompress "tflite"
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // LiteRT (formerly TensorFlow Lite). Its native libraries are 16 KB page
  // aligned, which Google Play requires for apps targeting Android 15+.
  // 1.x on purpose: 2.x needs Kotlin 2.3 in the host app and adds an unused
  // 3 MB GPU library. The classic Interpreter API is the same in both.
  implementation "com.google.ai.edge.litert:litert:1.4.2"

  // Encrypted SQLite (SQLCipher, AES-256), also 16 KB aligned.
  implementation "net.zetetic:sqlcipher-android:4.19.1@aar"
  implementation "androidx.sqlite:sqlite:2.7.0"

  // Reads the JPEG EXIF orientation that camera libraries write instead of
  // rotating pixels, so faces are not cropped from a sideways image.
  implementation "androidx.exifinterface:exifinterface:1.3.7"

  testImplementation "junit:junit:4.13.2"
}
