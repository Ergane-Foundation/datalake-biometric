name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, a Discussion is often a better start.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work. Mention API changes if any.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - JavaScript API
        - Android
        - iOS
        - Liveness
        - Models / accuracy
        - Sync backend
        - Example app
        - Documentation
        - CI / tooling

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The feature keeps biometric data on the device, or I explained why it cannot.
          required: true
