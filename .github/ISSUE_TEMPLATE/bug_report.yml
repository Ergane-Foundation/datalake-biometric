name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first.
        Security problems must not be reported here; see SECURITY.md.
        Never attach photos of real people's faces or other personal data.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of steps, ideally in the example app.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error code and message
      description: The `code` and `message` of the rejected promise, and relevant log output.
      render: text

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Example app only
        - Sync backend
        - ml_prep scripts
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: e.g. Samsung Galaxy A17, Android 14
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Library version or commit
      placeholder: e.g. 0.2.0 or a1b2c3d
    validations:
      required: true

  - type: input
    id: react-native
    attributes:
      label: React Native version
      placeholder: e.g. 0.85.0

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "`yarn setup:models --check` passes."
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
