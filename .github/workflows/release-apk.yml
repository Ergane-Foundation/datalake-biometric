name: Release APK (test only, debug-signed)

# Builds the example app in release mode (JavaScript bundled, no Metro needed)
# for testing on a phone. The APK is signed with a throwaway debug key made for
# this run: it is NOT a store build and must not be published.
#
# Manual only: Actions tab > "Release APK (test only, debug-signed)" > "Run
# workflow", or `gh workflow run release-apk.yml`. It uses no secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: Build test APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install required Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      # Downloads both models and checks their SHA-256 hashes, then creates the
      # debug keystore that signs this test build.
      - name: Download models and create debug keystore
        run: yarn setup

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        working-directory: example/android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-release-apk
          path: example/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
