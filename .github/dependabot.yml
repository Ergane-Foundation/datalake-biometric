# Weekly dependency updates. Per ecosystem, all minor and patch updates arrive as
# one grouped pull request; major updates stay separate so each can be reviewed
# on its own. Short group names keep pull request titles within the 100
# characters that the PR title check allows.
#
# Packages that must move together with a React Native upgrade are ignored here
# (patch updates still come through): React Native 0.x minor releases are
# breaking changes, and the React Native tooling and the Android build tools are
# pinned to what each React Native release supports. React, react-dom and
# react-test-renderer get no updates at all, not even patches: they must equal
# the renderer bundled in React Native exactly (yarn lint:react checks this).
# Upgrade them all at once, by hand (see the issue about upgrading React Native).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, js]
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: react-native
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: '@react-native/*'
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: '@react-native-community/cli*'
        update-types: [version-update:semver-minor, version-update:semver-major]
      # All updates, including patches (see the comment at the top).
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-test-renderer
      # 0.x minor releases that need code or device testing; update them with
      # the React Native upgrade.
      - dependency-name: react-native-builder-bob
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: react-native-monorepo-config
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: react-native-blob-util
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: gradle
    directories:
      - /android
      - /example/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, android]
    groups:
      gradle:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The Gradle wrapper, Android Gradle Plugin and Kotlin version must match the
      # React Native release (the React Native Gradle plugin is compiled with them).
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: com.android.tools.build:gradle
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: org.jetbrains.kotlin:*
        update-types: [version-update:semver-minor, version-update:semver-major]
      # LiteRT 2.x requires Kotlin 2.3 in every app that uses the SDK; stay on 1.x
      # until that is acceptable (see android/build.gradle).
      - dependency-name: com.google.ai.edge.litert:litert
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      pip:
        patterns: ['*']
        update-types: [minor, patch]
